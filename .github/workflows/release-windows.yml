name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Set update version
        run: npm version 1.1.${{ github.run_number }} --no-git-tag-version
      - name: Build and publish installer plus update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dist:win
