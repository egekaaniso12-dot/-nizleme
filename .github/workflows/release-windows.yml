name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Set update version
        run: npm version 1.1.${{ github.run_number }} --no-git-tag-version
      - name: Create release tag
        shell: pwsh
        run: |
          $tag = "v1.1.${{ github.run_number }}"
          git tag $tag
          git push origin $tag
      - name: Build Windows installer
        run: npm run dist:win
      - name: Attach installer and update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "1.1.${{ github.run_number }}"
          $tag = "v$version"
          $installer = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Kurulum dosyası bulunamadı.' }
          $blockmap = Get-Item "$($installer.FullName).blockmap"
          $hash = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($installer.FullName)))
          $size = (Get-Item $installer.FullName).Length
          $releaseDate = [DateTime]::UtcNow.ToString('o')
          $manifest = @"
          version: $version
          files:
            - url: $($installer.Name)
              sha512: $hash
              size: $size
          path: $($installer.Name)
          sha512: $hash
          releaseDate: '$releaseDate'
          "@
          $manifest | Set-Content -Path dist/latest.yml -Encoding utf8NoBOM
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title "EgeHS AI Vitrin $version" --notes "Windows x64 kurulum dosyası. Kaynak kod MIT lisansıyla yayımlanmıştır."
          }
          gh release upload $tag $installer.FullName $blockmap.FullName (Join-Path (Get-Location) 'dist/latest.yml') --clobber
